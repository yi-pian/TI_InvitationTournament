schema_version: 1
module_id: opa_dac_bias
name: OPA + DAC 偏置预算
path: MSPM0_Signal_Contest/07_signal_frontend/opa_dac_bias
category: 07_signal_frontend
implementation_type: RECIPE
recommendation: conditional
recommended_for_contest: true
status: BUILD_VERIFIED
purpose: 计算 DAC 偏置加有符号输入增益后的输出范围。
use_when: 输入信号有负半周，ADC 却只能测 0 V 以上时。 - 需要把信号抬到 1.65 V 等中点附近，再做放大和 ADC 采样时。 - 需要先计算最坏情况下的输出范围，避免 OPA/ADC
  饱和时。 不要用它直接输出 DAC 电压，也不要认为调用函数后片上 OPA 已经配置完成。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: 参数 | 单位 | 含义 | |---|---:|---| | input_voltage_v | V | 当前输入电压，可为负数 | | gain | 无 | 设计的总电压增益，可为负数
  | | dac_bias_v | V | 叠加的偏置，必须大于等于 0 | | output_voltage_v | V | 成功后写入理论输出 | 函数只校验输出指针和 dac_bias_v，不检查计算结果是否超过供电或
  ADC 范围。因此计算完还应使用 opa_to_adc 检查量程。
output: 参数 | 单位 | 含义 | |---|---:|---| | input_voltage_v | V | 当前输入电压，可为负数 | | gain | 无 | 设计的总电压增益，可为负数
  | | dac_bias_v | V | 叠加的偏置，必须大于等于 0 | | output_voltage_v | V | 成功后写入理论输出 | 函数只校验输出指针和 dac_bias_v，不检查计算结果是否超过供电或
  ADC 范围。因此计算完还应使用 opa_to_adc 检查量程。
