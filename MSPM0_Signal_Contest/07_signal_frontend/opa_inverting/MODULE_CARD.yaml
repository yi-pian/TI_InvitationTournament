purpose: 由目标反相增益和输入电阻计算反馈电阻。
use_when: 题目要求信号反相，同时按指定倍数放大时。 - 已知输入电阻，希望计算所需反馈电阻时。 - 需要先估算增益和偏置，再去 SysConfig 选择实际可实现拓扑时。 反相放大输出极性相反：请求
  -5 倍，表示输入 +0.1 V 的理想交流增量变为 -0.5 V。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: 公式为 Rfeedback = abs(requested_gain) x Rinput。 | 参数 | 单位/范围 | 含义 | |---|---|---| | requested_gain
  | 小于 0 | 目标反相增益，例如 -5.0f | | input_resistor_ohm | 欧姆，必须大于 0 | 理想输入电阻 | | bias_voltage_v | V，必须大于等于 0
  | 设计偏置，仅写入 config | | config | 输出 | 生成 INVERTING 软件配置 | | feedback_resistor_ohm | 欧姆，输出 | 计算得到的反馈电阻
output: 公式为 Rfeedback = abs(requested_gain) x Rinput。 | 参数 | 单位/范围 | 含义 | |---|---|---| | requested_gain
  | 小于 0 | 目标反相增益，例如 -5.0f | | input_resistor_ohm | 欧姆，必须大于 0 | 理想输入电阻 | | bias_voltage_v | V，必须大于等于 0
  | 设计偏置，仅写入 config | | config | 输出 | 生成 INVERTING 软件配置 | | feedback_resistor_ohm | 欧姆，输出 | 计算得到的反馈电阻
