implementation_type: RECIPE
recommendation: conditional
recommended_for_contest: true
status: BUILD_VERIFIED
purpose: 由目标同相增益和基准电阻计算反馈电阻。
use_when: 传感器或输入信号太小，需要放大但不希望相位翻转时。 - 已选择接地电阻，希望计算理想反馈电阻时。 - 需要在比赛中先确定增益和偏置，再选择片上 OPA/PGA 可实现档位时。 同相放大最小增益为
  1。典型用途是把 0.1 V 信号放大到约 1 V 后送 ADC。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: 公式为 Rfeedback = (requested_gain - 1) x Rground。 | 参数 | 单位/范围 | 含义 | |---|---|---| | requested_gain
  | 大于等于 1 | 目标同相增益 | | resistor_to_ground_ohm | 欧姆，必须大于 0 | 理想接地电阻 | | bias_voltage_v | V，必须大于等于 0 |
  设计偏置，仅写入 config | | config | 输出 | 生成 NONINVERTING 软件配置 | | feedback_resistor_ohm | 欧姆，输出 | 计算得到的反馈电阻
output: 公式为 Rfeedback = (requested_gain - 1) x Rground。 | 参数 | 单位/范围 | 含义 | |---|---|---| | requested_gain
  | 大于等于 1 | 目标同相增益 | | resistor_to_ground_ohm | 欧姆，必须大于 0 | 理想接地电阻 | | bias_voltage_v | V，必须大于等于 0 |
  设计偏置，仅写入 config | | config | 输出 | 生成 NONINVERTING 软件配置 | | feedback_resistor_ohm | 欧姆，输出 | 计算得到的反馈电阻
