purpose: 检查 OPA 预期输出是否落在 ADC 安全输入范围。
use_when: 已算出 OPA 输出的最小/最大电压，想在比赛前防止 ADC 过压或截幅时。 - 修改放大倍数、偏置或 ADC 参考电压后，需要快速复核量程时。 - 设计 OPA -> ADC 链路时，作为
  SysConfig 配置之前或之后的数字化安全检查。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: 成功后： 两个余量都大于等于 0，函数返回 SIGNAL_RESULT_OK；任一余量为负，返回 SIGNAL_RESULT_OUT_OF_RANGE，但余量数值仍可用于判断是哪一侧超范围。
output: 成功后： 两个余量都大于等于 0，函数返回 SIGNAL_RESULT_OK；任一余量为负，返回 SIGNAL_RESULT_OUT_OF_RANGE，但余量数值仍可用于判断是哪一侧超范围。
