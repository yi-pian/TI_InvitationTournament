schema_version: 1
module_id: dac_dc
name: DAC 固定直流输出
path: MSPM0_Signal_Contest/06_generator/dac_dc
category: 06_generator
implementation_type: DIRECT_DRIVERLIB
recommendation: deprecated
recommended_for_contest: false
status: BUILD_VERIFIED
purpose: 把目标直流电压换算为 DAC 码并通过适配器输出。
use_when: 固定 DC：直接 DriverLib。 - 连续周期波：Wave Table/DDS → DAC DMA。 - 任意波回放：捕获/重采样 → DAC DMA。 连续输出包含 Timer/Event/DMA/DAC
  协作，继续使用正式复杂模块，不要在循环里反复调用固定 DC 写函数。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: 旧 API 输入 signal_dac_t descriptor、目标 voltage_v 与结果指针。
output: DAC0：MSPM0G3507 的 DAC12 instance；换工程时以生成头和 .syscfg 为准。 - code：12-bit 无符号码，范围 0..4095。 - 0U：接近零量程；2048U：约半量程；4095U：接近满量程。
  - 题目要求改变输出时，直接修改 code。 理想换算为 code ≈ voltage_v / reference_voltage_v × 4095。真实输出还受参考电压、DAC 误差、放大器设置和负载影响；先用
  2048U 配合万用表/示波器验证约半量程。
