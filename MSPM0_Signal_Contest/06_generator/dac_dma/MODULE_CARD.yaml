status: BUILD_VERIFIED
purpose: 管理调用者提供的 DAC DMA 平台启动/停止接口。
use_when: 当你已经有一组 uint16_t samples[]，要由 Timer 定速、DMA 自动连续送到 MSPM0G3507 DAC 时使用。只输出一个固定电压时不要复制本模块，直接 SysConfig
  + DL_DAC12_output12(...)。 > 不知道 DAC Clock、Timer event、Fupdate 和 Fout 的区别，先读 Clock/Timer/ADC/DAC 保姆教程；不知道该选多少更新率，读
  采样率选择指南；现场回算看 一页速查。固定 DC 不需要 Timer/DMA。 比赛主入口是 signal_dac_dma_mspm0g3507.*，不需要 Application Platform
  或 callback。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: const uint16_t samples[count]，每个值为 12-bit DAC code（通常 0～4095）。
output: DAC0 引脚上的模拟阶梯波；示例输出脚为 PA15。
