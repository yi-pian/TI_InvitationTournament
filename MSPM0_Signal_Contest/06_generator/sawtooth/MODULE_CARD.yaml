purpose: 生成上升或下降锯齿波表。
use_when: 当题目需要“sawtooth”目录对应的公开功能，并且输入数据、单位和硬件资源满足前文约束时使用本模块。若只需要更简单的上游功能、输入尚未准备好，或需要不同的数据模型/外设资源，应先选择相邻模块而不是强行调用本
  API。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: 新接口增加 symmetry_fraction，它表示上升段占整个周期的比例，范围为 0 < x <= 1。 1.0f（100%）是标准上升锯齿，周期末瞬间回落；0.5f 表示上升和下降各占半周期；
  0.25f 表示上升占 25%、下降占 75%。
output: 输出写入调用者提供的结果/缓冲区，并返回 signal_result_t；不通过隐藏全局变量传递数据。
