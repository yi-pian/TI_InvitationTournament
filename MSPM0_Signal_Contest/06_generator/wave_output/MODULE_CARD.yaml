schema_version: 1
module_id: wave_output
name: Wave Output 整合模块
path: MSPM0_Signal_Contest/06_generator/wave_output
category: 06_generator
implementation_type: MODULE
recommendation: recommended
recommended_for_contest: true
status: BUILD_VERIFIED
purpose: 遵循 Beginner README 标准。
use_when: 当题目要求 MSPM0G3507 用片上 DAC 连续输出正弦波、方波、三角波或锯齿波，并希望 main.c 只填写频率、峰峰值和偏置时使用。只输出固定直流时直接用 DAC；捕获波形回放
  应使用 Arbitrary Wave；没有完成 DAC/Timer/Event/DMA SysConfig 闭环时不要调用本模块。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: 初始化输入：调用者提供静态 wave_table、静态 output_buffer、各自容量、DAC DMA 配置、DAC 位数和参考电压。这两个数组在 DMA 工作期间必须一直有效。 -
  每次输出输入：frequency_hz（Hz）、vpp_v（Vpp）、offset_v（V）。 - 方波扩展输入：duty_fraction（0～1 的小数，占空比；0.5f=50%）。 - 锯齿波扩展输入：symmetry_fraction（0～1
  的小数，上升段占周期比例；1.0f=标准上升锯齿，0.5f=上升/下降各半周期）。 - 硬件输出：DAC 引脚上的连续周期波形。 - 软件结果：SignalWaveOutput_GetLastResult()
  返回请求/实际频率、Vpp、偏置和 DMA 点数。
output: 初始化输入：调用者提供静态 wave_table、静态 output_buffer、各自容量、DAC DMA 配置、DAC 位数和参考电压。这两个数组在 DMA 工作期间必须一直有效。 -
  每次输出输入：frequency_hz（Hz）、vpp_v（Vpp）、offset_v（V）。 - 方波扩展输入：duty_fraction（0～1 的小数，占空比；0.5f=50%）。 - 锯齿波扩展输入：symmetry_fraction（0～1
  的小数，上升段占周期比例；1.0f=标准上升锯齿，0.5f=上升/下降各半周期）。 - 硬件输出：DAC 引脚上的连续周期波形。 - 软件结果：SignalWaveOutput_GetLastResult()
  返回请求/实际频率、Vpp、偏置和 DMA 点数。
