purpose: 本题的输入条件是：X 频率 1.5~2 kHz，Y 是 X 的 1~5 倍，且两路由同一个 Timer 触发同步采样。模块先找 X 的上升过零点，再在其前后找最近的 Y 上升过零点，最后按已知频率比计算相位。
use_when: 本题的输入条件是：X 频率 1.5~2 kHz，Y 是 X 的 1~5 倍，且两路由同一个 Timer 触发同步采样。模块先找 X 的上升过零点，再在其前后找最近的 Y 上升过零点，最后按已知频率比计算相位。
  不要把它用于两路不同步、频率比未知、DMA 尚未完成或信号幅度太小的情况。若只需要把两个已经提取好的过零位置换算成相位，可直接使用已有的 03_measurement/phase 模块；本模块的区别是把过零检测也包含在一次调用中。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
