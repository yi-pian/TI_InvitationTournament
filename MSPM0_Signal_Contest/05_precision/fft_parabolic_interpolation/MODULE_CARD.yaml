schema_version: 1
module_id: fft_parabolic_interpolation
name: FFTParabolicInterpolation：峰值在两个 bin 之间怎么办
path: MSPM0_Signal_Contest/05_precision/fft_parabolic_interpolation
category: algorithm/05_precision
implementation_type: MODULE
recommendation: recommended
recommended_for_contest: true
status: PC_VERIFIED
purpose: 适合： Peak 已给出内部峰 bin，想用它和左右邻点把频率细化到 fractional bin。它需要线性 magnitude，且峰不能在数组两端。
use_when: FFT 测单音频率、峰不在 bin 中心时。Hann 常用，但线性 magnitude 抛物线有偏差；高精度可再比较 log-parabolic。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: 至少包含 peak_bin-1、peak_bin、peak_bin+1 的 magnitude，真实 Fs 和 FFT size。
output: offset（-0.5~0.5 bin）、fractional_bin、frequency_hz、插值 magnitude（仍是输入标度）。
unit:
- Hz
- dB
- V
