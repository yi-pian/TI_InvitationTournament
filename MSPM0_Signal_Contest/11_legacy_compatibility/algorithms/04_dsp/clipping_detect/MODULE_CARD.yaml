purpose: 如果输入超过 ADC 或模拟前端范围，波峰会被“削平”。该模块统计有多少点低于低阈值或高于高阈值，给后续测量一个质量警告。
use_when: Vpp、RMS、FFT/THD 前做数据质量检查；若报警，优先调整量程/增益，而不是继续相信幅值结果。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: voltage_v[] 单位 V，count>0；low_limit_v<high_limit_v，两者也为 V。
output: low_clipped_count/high_clipped_count/clipped_count（点），clipped_ratio（0~1 无量纲），is_clipped（0/1）。
