purpose: 把一组数相加后除以点数。对电压数组，它给出这段记录的平均电压，也就是常用的 DC 测量结果。
use_when: 测直流电压、估计正弦偏置、对重复且稳定的读数降噪。若目标是交流 RMS，不应把 Mean 当 RMS；应使用 AC_RMS 或 RemoveDC 后 RMS。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: const float *samples，长度 count>0。输入可以是 V 或其他明确单位，但不能含 NaN/Inf。
output: signal_mean_result_t.mean_value，单位与输入相同。输入是 V，输出就是 V。
