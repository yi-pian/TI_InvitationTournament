purpose: 适合： 你已经有 uint16_t raw[N]，下一步算法需要单位为 V 的 float voltage_v[N]。
use_when: 几乎所有以 ADC RAW 开始、最后要输出 V 的链都先用它：DC、Vpp、RMS、FFT 幅值、THD 幅值。只测 code 是否撞满量程时可以直接看 RAW，不必换算。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: const uint16_t raw[N]；真实 ADC full-scale code、VREF，以及前端比例/校准偏置。
output: float voltage_v[count]，单位 V。调用者必须提前准备至少 4*count 字节。若发现 RAW 超过 adc_max_code，函数返回越界且不写任何输出。
