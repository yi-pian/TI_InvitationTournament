purpose: 目标：“在一帧 float 波形中找出每次上升/下降穿过阈值的相邻样本索引”。它只找夹点；要精细频率还要接 Interpolation 和 Multi Cycle Average。
use_when: 纯正弦或边沿明确、SNR 较高的频率和相位测量。方波边沿非常干净时优先用硬件 Timer Capture；低 SNR 正弦可考虑 FFT。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: voltage_v[]：单位 V，可含 DC。 - count>=2。 - threshold_v：实际比较中心，V。 - hysteresis_v>=0：重新武装宽度，V。 - direction：RISING/FALLING/BOTH。
  - events[]/event_capacity：调用者工作区。
output: 事件数组，每项包含相邻 left_index/right_index 和方向；result 提供总数、上升数、下降数。没有事件返回 SIGNAL_ALGORITHM_NO_FEATURE。
