supply: AVDD-AVSS 和 DVDD-DGND 推荐范围均为 2.3～5.5 V。最容易联调的单电源方案是 AVDD=DVDD=3.3 V、AVSS=DGND=GND，每组电源就近放至少 100
  nF 去耦。模拟输入绝对电压及 PGA 共模范围仍须遵守数据手册，不能仅按数字满量程判断。
logic_voltage: must be checked against exact device/module supply and datasheet
control_pins: SDA：I2C 数据； - SCL：I2C 时钟； - RESET：低有效复位，可接 GPIO，也可拉高仅使用 RESET 命令； - DRDY：低有效数据就绪，可接 GPIO；初次可不接，轮询寄存器
  2 的 DRDY 位； - A0/A1：地址选择，通常硬接 GND 或 DVDD，不需要 MCU 动态控制。 封装引脚号不同：TSSOP 的 SDA/SCL 为 15/16，WQFN 的 SDA/SCL
  为 13/14。连线时按你手上封装的 Pin Functions 表，不按本 README 猜脚号。
