purpose: 把连续采集帧交给回调并记录完成/丢帧计数。
use_when: 适合：连续 ADC Ping-Pong DMA 每完成一帧就送入 RMS、FFT 或显示处理；希望把“采集”和“处理一帧”分开并统计是否丢帧；或先在 PC 上用模拟帧验证处理函数。 不适合：用它代替
  adc_dma、adc_pingpong_dma 配置 ADC/Timer/DMA；只采一帧后直接处理；或想在回调返回后长期保存上游 DMA 缓冲区指针。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: 输入由各 API 的只读数组、配置、频率/阈值和平台对象组成；输出写入 result/output/buffer 参数或由 Get API 返回。调用者负责数组容量、生命周期和物理单位；失败返回时输出不是有效结果。
output: 输入由各 API 的只读数组、配置、频率/阈值和平台对象组成；输出写入 result/output/buffer 参数或由 Get API 返回。调用者负责数组容量、生命周期和物理单位；失败返回时输出不是有效结果。
