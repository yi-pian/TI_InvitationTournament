purpose: 管理双缓冲 DMA 的 ready、release 和 overrun 状态。
use_when: 适合：连续显示波形、连续 FFT、持续 RMS；DMA 一帧完成后 CPU 仍要处理较长时间；或需要发现 CPU 未处理完而 DMA 已绕回来的 overrun。 不适合：只采一次 N
  点（用 adc_dma 更简单）；想把本纯软件状态模块直接当 ADC + DMA 驱动；或无法给两块 buffer 各自完整一帧的 RAM。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
