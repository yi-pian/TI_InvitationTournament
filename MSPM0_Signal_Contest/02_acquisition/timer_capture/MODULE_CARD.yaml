recommended_for_contest: true
status: BUILD_VERIFIED
purpose: 处理计数器回绕并由捕获时间戳计算平均周期。
use_when: 当输入能先变成稳定数字边沿，且你要低 CPU、高精度测周期/频率时使用。24_C 用它为周期波形截取 3 周期时间轴，范围约 95 Hz~10.5 kHz；复合信号的 H1/频谱时间轴仍以
  FFT 基波为准。示例链路是 模拟信号 -> Comparator -> Event -> Timer Capture。任意波形、弱信号或严重噪声下，先解决比较器阈值/整形。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: 同方向边沿对应的 Timer capture 值。
output: float frequency_hz、平均周期 ticks。
unit:
- Hz
- percent
- V
- timer ticks
