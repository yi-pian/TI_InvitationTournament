schema_version: 1
module_id: adc_dual_sync
name: Dual ADC：双通道同步采集
path: MSPM0_Signal_Contest/02_acquisition/adc_dual_sync
category: 02_acquisition
implementation_type: MODULE
recommendation: recommended
recommended_for_contest: true
status: BUILD_VERIFIED
purpose: 把同步双通道交织数据拆成两个独立数组。
use_when: 适合： - 测两个正弦信号的相位差，例如放大器输入 Vin 与输出 Vout。 - 同时比较两路幅值、波形或峰峰值。 - 一路模拟信号加一路猝发标志，要求样本下标能够对应相同时间。 -
  后面要把 A、B 分别送进 ADC To Voltage、Phase、Correlation 或 FFT。 不适合： - 只测一路直流电压或普通单通道波形，使用 adc_dma 更简单。 - 两路数据不需要时间对应，先后软件读取即可。
  - 想把一个 ADC 的单次转换结果复制两份，这不是双通道采集。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: 模拟输入： 两路均必须在 ADC 允许的电压范围内，不能把超出 VDDA/VSSA 的信号直接接入。 - 输入参数： 每通道采样率 Fs 和每帧点数 N。 - 输出： uint16_t raw_a[N]
  与 uint16_t raw_b[N]。raw_a[i] 和 raw_b[i] 对应第 i 次 Timer 触发。 - 内存： 两路原始码占 2 * N * sizeof(uint16_t) = 4N
  字节。N=1024 时为 4096 B，不含栈和后续浮点数组。 采集未完成时 DMA 正在写数组，不能读取、改写、传给 FFT 或用于显示。完成后到下一次 Start() 前才是安全处理期。
output: 模拟输入： 两路均必须在 ADC 允许的电压范围内，不能把超出 VDDA/VSSA 的信号直接接入。 - 输入参数： 每通道采样率 Fs 和每帧点数 N。 - 输出： uint16_t raw_a[N]
  与 uint16_t raw_b[N]。raw_a[i] 和 raw_b[i] 对应第 i 次 Timer 触发。 - 内存： 两路原始码占 2 * N * sizeof(uint16_t) = 4N
  字节。N=1024 时为 4096 B，不含栈和后续浮点数组。 采集未完成时 DMA 正在写数组，不能读取、改写、传给 FFT 或用于显示。完成后到下一次 Start() 前才是安全处理期。
