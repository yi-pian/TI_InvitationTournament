recommendation: recommended
recommended_for_contest: true
status: BOARD_VERIFIED
purpose: Timer/Event 触发 ADC，DMA 完整搬运 N 点到调用者 RAM
use_when: 当你要按固定采样率取得一帧 N 点 ADC 原始数据时使用。它把 Timer、Event、ADC 和 DMA 合成一次“启动—等待—得到 raw[N]”操作。只读一次 ADC 寄存器时不需要它，直接用
  SysConfig + TI DriverLib。 > 不知道 Fs 为什么由 Timer event 决定，先读 Clock/Timer/ADC/DAC 保姆教程；不知道题目该选多少 Fs/N，读
  采样率选择指南；现场回算看 一页速查。ADC Clock 不是 Fs。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: 目标采样率 sample_rate_hz、采样点数 sample_count、ADC 模拟输入。
output: uint16_t raw[N]、实际配置触发率 Hz 和完成状态。
