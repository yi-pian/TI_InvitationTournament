purpose: 目标：“在 float、Q15 和 ADC raw 之间转换数据表示，或累加 Q15 平方”。它是拼接支持模块，不负责 ADC、FFT 或物理电压校准。
use_when: 当整条链准备采用 CMSIS Q15 FFT/FIR，并希望避免 RAW→整块float→Q15 的重复转换时使用。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: ADC RAW：uint16_t，单位为 ADC code； - float：单位可以是 V，但 full_scale 必须也是 V； - Q15：int16_t，约定 -1 到 +1。
output: Q15、float 物理量，或供 RMS/能量继续计算的 Q30 平方和。
unit:
- ADC code
- Hz
- V
