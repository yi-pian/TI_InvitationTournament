purpose: 适合： FFT 前减少记录首尾不连续造成的频谱泄漏。正常频谱测量默认先用 Hann；整周期严格相干采样才常用 Rectangular。
use_when: 未知正弦频率、非相干采样的频谱/频率/THD。严格相干采样且要分辨很近频率时可用 Rectangular。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: const float input[N]；普通频谱默认 Hann，只有相干采样等明确条件才换窗。
output: 加窗数组（单位仍为 V）及 coherent_gain=mean(w)、power_gain=mean(w²)。两种 gain 不可混用。
