purpose: 适合： 已有 FFT magnitude 和基波频率，要按 1～N 次谐波目标频率在邻近多个 bin 积分。不要只取单个 bin 来测非相干采样谐波。
use_when: 谐波表、THD、判断削顶/非线性失真；24_C 只用 FFT 插值基波计算 H1~H5，使用 Hann 后的邻近 bin 能量，不能让 Timer Capture 频率覆盖 fundamental_frequency_hz。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: 非负频率 magnitude、bin_count、真实 Fs、FFT size 和精细基波频率。
output: 每阶目标 Hz、fractional/center bin、实际积分范围、energy/RSS。
