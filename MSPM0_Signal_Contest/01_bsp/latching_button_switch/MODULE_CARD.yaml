schema_version: 1
module_id: latching_button_switch
name: 自锁按键开关模块
path: MSPM0_Signal_Contest/01_bsp/latching_button_switch
category: 01_bsp
implementation_type: MODULE
recommendation: recommended
recommended_for_contest: true
status: BUILD_VERIFIED
purpose: 读取机械自锁开关，首次同步物理状态并输出 ON/OFF 转换事件
use_when: 当题目需要“latching_button_switch”目录对应的公开功能，并且输入数据、单位和硬件资源满足前文约束时使用本模块。若只需要更简单的上游功能、输入尚未准备好，或需要不同的数据模型/外设资源，应先选择相邻模块而不是强行调用本
  API。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: read_on(context, &on)：平台回调把实际 GPIO 电平转换为逻辑 ON/OFF。 - debounce_scans：连续多少次相同读数后确认新状态。 - 应用固定周期调用
  Update，推荐 5 ms。 模块第一次得到稳定读数时只完成“上电状态同步”，不会错误地产生 turned_on/turned_off 事件。
output: SignalLatchingButtonSwitch_Update() 输出： - raw_on：本次直接读取的逻辑 ON/OFF； - state_valid：是否已经完成第一次稳定状态同步；
  - stable_on：当前消抖后的物理位置； - changed：本次是否确认发生切换； - turned_on：刚从 OFF 切到 ON； - turned_off：刚从 ON 切到 OFF。 初始化后的前几次扫描可能
  state_valid=false。GetState() 此时返回 SIGNAL_RESULT_NO_DATA，确认后才返回 ON/OFF。
