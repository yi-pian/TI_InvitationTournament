purpose: 统一单次 ADC 原始码读取接口和通道/参考配置。
use_when: 优先使用：输入在 0～VREF/VDD、1～2 路采集、12-bit/实际 ENOB 与最高 4 MSPS 能满足题目，并希望用 Timer/Event/DMA 内部触发。 - 慎用：接近
  4 MSPS、高源阻、500 kHz 级输入、需要严格幅相/噪声指标；必须核对采样建立时间、每周期点数、VREF 和前端驱动。 - 不要强行使用：16/18/24-bit 精密测量、双极性/高压直入、超过两路严格同步或
  >4 MSPS；应评估外置 ADC。 先看 MSPM0G3507 资源能力指南 和 内部/外置选择指南。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
