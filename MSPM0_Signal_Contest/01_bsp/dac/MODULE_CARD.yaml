purpose: 统一 DAC 原始码输出及电压到码值换算。
use_when: 优先使用：固定 DC bias、VGA/PGA 控制电压、中低频简单波形；内部 12-bit、1 MSPS DAC 的接线和调试成本最低。 - 慎用：100 kHz 级正弦、接近满幅的快速跳变、低阻或大电容负载；先算每周期点数、2πfVpk、建立时间并上板测
  THD/幅值。 - 不要强行使用：500 kHz 高质量正弦、MHz 波形、精密 DC 或大电流驱动；应评估外置 DDS/DAC/缓冲器。 先看 MSPM0G3507 资源能力指南 和 内部/外置选择指南。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: 输入由公开头文件中的指针、长度、配置结构或平台回调给出；所有单位写在字段名中。
output: 输出写入调用者提供的结果/缓冲区，并返回 signal_result_t；不通过隐藏全局变量传递数据。
