purpose: 描述并校验 DMA 传输，再交给平台适配器执行。
use_when: 优先使用：ADC→RAM、RAM→DAC/FIFO、连续串口等规则搬运；MSPM0G3507 只有 7 个 DMA channel，应由完整功能模块统一配置。 - 慎用：多个 ADC、DAC、UART/SPI
  同时工作；先做 channel、trigger、transfer width 和 Event 资源表。 - 不要单独选择：DMA 不是题目功能；采集选 ADC DMA，连续输出选 DAC DMA。通道已耗尽时不能靠复制
  wrapper 解决。 芯片 DMA/Event 能力见 MSPM0G3507 资源能力指南，冲突检查见 RESOURCE_CONFLICT_GUIDE.md。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: 输入由公开头文件中的指针、长度、配置结构或平台回调给出；所有单位写在字段名中。
output: 输出写入调用者提供的结果/缓冲区，并返回 signal_result_t；不通过隐藏全局变量传递数据。
