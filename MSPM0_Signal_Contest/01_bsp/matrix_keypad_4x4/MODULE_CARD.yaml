schema_version: 1
module_id: matrix_keypad_4x4
name: 4×4 矩阵键盘模块
path: MSPM0_Signal_Contest/01_bsp/matrix_keypad_4x4
category: 01_bsp
implementation_type: MODULE
recommendation: recommended
recommended_for_contest: true
status: BUILD_VERIFIED
purpose: 用 4 行+4 列 GPIO 扫描 16 键，输出消抖后的按下/释放/稳定状态
use_when: 当题目需要“matrix_keypad_4x4”目录对应的公开功能，并且输入数据、单位和硬件资源满足前文约束时使用本模块。若只需要更简单的上游功能、输入尚未准备好，或需要不同的数据模型/外设资源，应先选择相邻模块而不是强行调用本
  API。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: drive_row(context, row, active)：选择或释放某一行；模块只说“active”，平台回调决定 active 对应低电平。 - read_column(context,
  column, &active)：读取某一列当前是否和被选中的行导通。 - 可选微秒延时回调与 settle_us，用于切换行后等待电平稳定。 - debounce_scans：同一个 raw 按键状态连续出现多少次才确认。
  - 可选 16 字节 row-major keymap。
output: SignalMatrixKeypad4x4_Scan() 每次返回： - raw_mask：本次直接扫描到的 16-bit 状态；bit0=R1C1，bit15=R4C4； - stable_mask：通过消抖后的当前状态；
  - pressed_mask：本次新确认按下的键； - released_mask：本次新确认松开的键； - ghost_possible：无二极管键盘上，多行多列同时导通，可能出现“鬼键”。 GetFirstPressed()
  可把当前第一个稳定按键直接转为 '0'..'9'、A..D、*、#。
