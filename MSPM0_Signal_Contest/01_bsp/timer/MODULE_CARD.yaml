  分辨率、位宽和溢出。 - 不要强行使用：所需精度已超过时钟准确度，或实例/Event/PinMux 与现有采集、DAC、Capture 明确冲突；先重做资源分配或外加时基。 芯片 Timer 数量和系统能力见
