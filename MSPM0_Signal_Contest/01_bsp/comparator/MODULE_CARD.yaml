purpose: 描述比较器阈值、迟滞和极性并交给平台适配器。
use_when: 优先使用：方波/边沿测频、一般过零、硬件阈值、Trigger 和 Comparator Event → Timer Capture；内部互联能省接线和软件延迟。 - 慎用：小幅正弦的精密过零或相位；内部
  Comparator 最大 ±20 mV 级 offset、hysteresis/filter 和传播延迟都可能形成误差。 - 不要强行使用：输入超出 0～VDD、要求远低于几十 ns 的延迟/dispersion，或阈值精度明显超过内部能力；应评估具体外置
  Comparator。 性能卡与外置选择条件见 MSPM0G3507 资源能力指南 和 内部/外置选择指南。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
