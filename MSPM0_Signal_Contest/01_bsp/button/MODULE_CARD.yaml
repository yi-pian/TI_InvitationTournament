name: 普通瞬时按键模块
path: MSPM0_Signal_Contest/01_bsp/button
category: 01_bsp
implementation_type: MODULE
recommendation: recommended
recommended_for_contest: true
status: BUILD_VERIFIED
purpose: 读取普通瞬时按键，输出消抖后的 pressed/released/stable 状态
use_when: 当题目需要“button”目录对应的公开功能，并且输入数据、单位和硬件资源满足前文约束时使用本模块。若只需要更简单的上游功能、输入尚未准备好，或需要不同的数据模型/外设资源，应先选择相邻模块而不是强行调用本
  API。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: read_pressed(context, &pressed) 平台回调；回调必须把实际 GPIO 电平转换成逻辑 pressed。 - debounce_scans：连续多少次相同读数后才确认，必须大于
  0。 - 应用提供固定调用周期，推荐每 5 ms 调用一次 Update。 常用 active-low 接法中，GPIO 低电平表示按下，因此回调应返回 pressed = (pin_is_low)。
output: 每次 SignalButton_Update() 输出： - raw_pressed：本次直接读到的逻辑状态； - stable_pressed：消抖后的当前状态； - pressed：本次刚确认按下，只出现一次；
  - released：本次刚确认松开，只出现一次。 SignalButton_GetPressed() 可随时读取稳定状态。
