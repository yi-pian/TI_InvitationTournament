use_when: 当上游已经选择好显示窗口的 float samples[N] 时使用。24_C 周期信号按硬件频率截取 3 周期，复合信号按 FFT 基波设 X 轴，猝发使用 marker 锁存的完整窗口并优先
  min-max envelope；轴、刻度、V/ms 单位和触发判定由应用层提供。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
