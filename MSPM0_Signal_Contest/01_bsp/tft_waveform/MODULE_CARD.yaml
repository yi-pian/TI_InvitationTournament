  必须同单位 | | 输出 | 直接调用 TFT 基础图元；result 返回数据范围、实际 scale 和列数 | | RAM | O(1)，动态分配 0，无 framebuffer | | CPU
  | O(N + 屏宽)；真正耗时通常是阻塞 SPI 绘制
