purpose: 描述 GPAMP 增益与偏置配置并交给平台适配器。
use_when: 低频传感器、慢变直流或需要低频精度前端时，先做 GPAMP 参数预算。 - 需要验证目标 gain 与 bias 参数是否为正/非负时。 - 要真正使用 GPAMP 时，应在 SysConfig
  配置；不要把通过软件校验当成硬件已经启用。 对需要较高频率或较大增益的链路，应先比较 GPAMP 的带宽/压摆率与 OPA 或外置运放，而不是默认使用 GPAMP。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: SignalGPAMP_ValidateConfig() 要求 requested_gain > 0 且 bias_voltage_v >= 0。这只验证软件参数，不验证增益是否是当前芯片实际支持的离散档位。
output: SignalGPAMP_ValidateConfig() 要求 requested_gain > 0 且 bias_voltage_v >= 0。这只验证软件参数，不验证增益是否是当前芯片实际支持的离散档位。
