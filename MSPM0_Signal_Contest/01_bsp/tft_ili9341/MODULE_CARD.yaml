purpose: 通过回调式 SPI/GPIO 驱动 240×320 ILI9341，提供基础图形、RGB565、4 套 ASCII 字体和自定义单色字模输出
use_when: 当题目需要显示多行数值、菜单、曲线或简单图形时使用；24_C 用它绘制一次静态坐标轴、单位和标签，再只刷新波形矩形和数字字段。只亮灭 LED 或输出串口无需它。当前比赛入口锁定 MSPM0G3507
  + SysConfig SPI，使用内置 ASCII 字库和少量示例中文字模；ISR 不得调用 TFT/SPI。
do_not_use_when: A simpler DriverLib/Recipe route satisfies the task, resources conflict, or the README
  limitations apply.
input: 坐标、颜色 RGB565、ASCII 字符串、整数/浮点数或单色位图。
output: ILI9341 屏幕图像。
